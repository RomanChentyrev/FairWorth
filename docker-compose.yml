services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairworth
      POSTGRES_USER: fairworth
      POSTGRES_PASSWORD: fairworth
    ports:
      - "5433:5432"
    volumes:
      - fairworth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairworth"]
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fairworth_postgres:

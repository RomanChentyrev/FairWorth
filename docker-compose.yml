services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairworth
      POSTGRES_USER: fairworth
      POSTGRES_PASSWORD: fairworth
    ports:
      - "5433:5432"
    volumes:
      - fairworth_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fairworth"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fairworth_postgres:

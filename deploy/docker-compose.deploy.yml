name: fairworth-${DEPLOY_ENV:-production}

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
      ACCESS_GATE_USER: ${ACCESS_GATE_USER:?ACCESS_GATE_USER is required}
      ACCESS_GATE_PASSWORD_HASH: ${ACCESS_GATE_PASSWORD_HASH:?ACCESS_GATE_PASSWORD_HASH is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    image: ${REGISTRY_IMAGE:?REGISTRY_IMAGE is required}/web:${IMAGE_TAG:?IMAGE_TAG is required}
    restart: unless-stopped

  migrate:
    image: ${REGISTRY_IMAGE}/api:${IMAGE_TAG}
    env_file: ${SERVER_ENV_FILE:?SERVER_ENV_FILE is required}
    command: ["node", "scripts/setup-postgres.js"]
    restart: "no"

  api:
    image: ${REGISTRY_IMAGE}/api:${IMAGE_TAG}
    restart: unless-stopped
    env_file: ${SERVER_ENV_FILE}
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS_ON_START: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SENTRY_ENVIRONMENT: ${DEPLOY_ENV:-production}
      SENTRY_RELEASE: ${IMAGE_TAG}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    image: ${REGISTRY_IMAGE}/api:${IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file: ${SERVER_ENV_FILE}
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS_ON_START: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SENTRY_ENVIRONMENT: ${DEPLOY_ENV:-production}
      SENTRY_RELEASE: ${IMAGE_TAG}
    command: ["node", "worker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  catalog-worker:
    image: ${REGISTRY_IMAGE}/api:${IMAGE_TAG}
    restart: unless-stopped
    healthcheck:
      disable: true
    env_file: ${SERVER_ENV_FILE}
    environment:
      NODE_ENV: production
      RUN_MIGRATIONS_ON_START: "false"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SENTRY_ENVIRONMENT: ${DEPLOY_ENV:-production}
      SENTRY_RELEASE: ${IMAGE_TAG}
    command: ["node", "catalogWorker.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  redis_data:

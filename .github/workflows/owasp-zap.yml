name: OWASP ZAP baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Staging URL to scan
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
